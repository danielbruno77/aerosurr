# Data-efficiency study (SPEC §5.2): HF-only Transolver on scarce_train (67 runs), the same
# ~20k-step budget for every training-set size, selected on full_val, tested on full_test.
split: scarce
epochs: 300
points: 200000
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 8
seed: 0
compile: true
bf16: true
data_on_gpu: true
eval_every: 20
full_eval_every: 150
max_hours: 1.5
