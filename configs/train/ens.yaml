# Deep-ensemble members (SPEC §5.4): full_train, ~20k steps each; members differ by seed
# (initialisation and data order), set with `aerosurr train run --seed`.
split: full
epochs: 50
points: 200000
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 2
seed: 0
compile: true
bf16: true
data_on_gpu: true
eval_every: 5
full_eval_every: 25
max_hours: 1.5
